name: Deploy to Hetzner

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          CI: false
        run: |
          npm run build
          echo "=== Содержимое dist/ ==="
          ls -la dist/
          echo "=== Содержимое dist/client/ ==="
          ls -la dist/client/ || echo "❌ dist/client не найдена!"
          
          if [ ! -f "dist/client/index.html" ]; then
            echo "❌ ОШИБКА: index.html не найден в dist/client/"
            exit 1
          fi
          echo "✅ index.html найден!"

      - name: Deploy to Hetzner via FTP
        uses: sebastianpopp/ftp-action@v3.3.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: ./dist/client/
          remoteDir: /public_html/
          options: "--delete --verbose"

      - name: Verify deployment
        run: |
          echo "✅ Деплой завершён!"
          echo "Проверьте сайт: https://freieevangeliums-dresden.de"
