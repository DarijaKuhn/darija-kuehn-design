name: Deploy to Hetzner

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          CI: false
        run: |
          npm run build
          echo "=== Содержимое dist/ ==="
          ls -la dist/
          echo "=== Содержимое dist/client/ ==="
          ls -la dist/client/ || echo "❌ dist/client не найдена!"
          
          if [ ! -f "dist/client/index.html" ]; then
            echo "❌ ОШИБКА: index.html не найден в dist/client/"
            exit 1
          fi
          echo "✅ index.html найден!"

      - name: Deploy to Hetzner via FTPS
        uses: SamirKhandelwal/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/client/
          server-dir: /public_html/
          protocol: ftps
          force-pasv: true
          dangerous-clean-slate: true
          timeout: 60000

      - name: Upload .htaccess
        uses: SamirKhandelwal/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          protocol: ftps
          force-pasv: true
          dangerous-clean-slate: false
          local-glob: .htaccess

      - name: Verify deployment
        run: |
          echo "✅ Деплой завершён!"
          echo "Проверьте сайт: https://freieevangeliums-dresden.de"
