name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Copy files to Hetzner
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Build Project
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        CI: false
      run: |
        npm run build -- --v
        if [ ! -d "./dist/client" ]; then
          mkdir -p ./dist/client
          cp -r ./public/* ./dist/client/ 2>/dev/null || true
          cp index.html ./dist/client/ 2>/dev/null || true
        fi

    - name: Sync files via FTPS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/client/
        server-dir: /freieevangeliums-dresden.de/public_html/
        protocol: ftps
        force-pasv: true
