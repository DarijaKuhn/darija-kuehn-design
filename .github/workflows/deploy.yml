name: Deploy to Hetzner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          CI: false
        run: |
          npm run build
          ls -la dist/client/ || (echo "❌ dist/client не найдена!" && exit 1)
          if [ ! -f "dist/client/index.html" ]; then
            echo "❌ index.html не найден в dist/client/"
            exit 1
          fi
          if [ -f "public/.htaccess" ]; then
            cp public/.htaccess dist/client/.htaccess
          fi
          if [ -f "public/.user.ini" ]; then
            cp public/.user.ini dist/client/.user.ini
          fi
          if [ -f "public/api/.user.ini" ]; then
            mkdir -p dist/client/api
            cp public/api/.user.ini dist/client/api/.user.ini
          fi
          if [ ! -f "dist/client/api/upload-chunk.php" ]; then
            echo "❌ upload-chunk.php не попал в сборку!"
            exit 1
          fi
          echo "✅ Сборка готова!"

      - name: Deploy via FTPS to Hetzner
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/client/
          server-dir: /public_html/
          protocol: ftps
          port: 21
          security: loose

      - name: Verify files on Hetzner via LFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          echo "=== Список файлов в /public_html/ на Hetzner ==="
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            -e "set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; ls /public_html/; bye" \
            "${{ secrets.FTP_SERVER }}" > remote_listing.txt
          cat remote_listing.txt

          if ! grep -q "index.html" remote_listing.txt; then
            echo "❌ index.html НЕ найден на сервере!"
            exit 1
          fi
          echo "✅ index.html найден на сервере"

          echo "=== Проверка PHP-файлов и лимитов загрузки ==="
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            -e "set ssl:verify-certificate no; set ftp:ssl-force true; set ftp:ssl-protect-data true; cls -a /public_html/; cls -a /public_html/api/; bye" \
            "${{ secrets.FTP_SERVER }}" > remote_hidden_listing.txt
          cat remote_hidden_listing.txt

          if ! grep -q ".user.ini" remote_hidden_listing.txt; then
            echo "❌ .user.ini НЕ найден на сервере — большие загрузки не будут работать!"
            exit 1
          fi
          if ! grep -q "upload-chunk.php" remote_hidden_listing.txt; then
            echo "❌ upload-chunk.php НЕ найден на сервере!"
            exit 1
          fi
          echo "✅ PHP-настройки и chunk-загрузка найдены"

          if ! grep -q "assets" remote_listing.txt; then
            echo "⚠️ Папка assets не найдена — проверьте вручную"
          else
            echo "✅ Папка assets найдена"
          fi

      - name: Verify site is live
        run: |
          echo "✅ Деплой завершён!"
          sleep 5
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" https://freieevangeliums-dresden.de/)
          echo "HTTP код: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Сайт вернул код $HTTP_CODE вместо 200"
            exit 1
          fi
          echo "✅ Сайт работает: https://freieevangeliums-dresden.de/"

